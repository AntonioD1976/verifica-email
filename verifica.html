<!DOCTYPE html> <html lang="it"> <head> <meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Verifica email - DV Cardio Center</title> <style> * { box-sizing: border-box; } body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; font-family: Arial, Helvetica, sans-serif; background: #f5f7fa; color: #333; } .box { width: 100%; max-width: 500px; background: #ffffff; padding: 40px 30px; border-radius: 14px; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08); text-align: center; } .logo { font-size: 21px; font-weight: bold; color: #1976d2; margin-bottom: 30px; } .icon { width: 70px; height: 70px; margin: 0 auto 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: #e8f5e9; color: #198754; font-size: 42px; font-weight: bold; } h1 { margin: 0 0 15px; font-size: 26px; color: #333; } p { margin: 0; font-size: 16px; line-height: 1.6; color: #666; } .error .icon { background: #ffebee; color: #dc3545; } .error h1 { color: #b02a37; } .footer { margin-top: 30px; padding-top: 20px; border-top: 1px solid #eeeeee; font-size: 13px; line-height: 1.5; color: #888; } </style> </head> <body> <div class="box" id="box">
<div class="logo">
  DV Cardio Center
</div>

<div class="icon" id="icon">
  ...
</div>

<h1 id="titolo">
  Verifica in corso
</h1>

<p id="messaggio">
  Stiamo verificando il tuo indirizzo email...
</p>

<div class="footer">

  Dott. Vincenzo Duino<br>
  Cardiologo<br>
  Via Angelo Maj 30/C - Bergamo

</div>

</div> 
  <script> 
    // ========================================================== 
    // URL WEB APP APPS SCRIPT 
    // ========================================================== 
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyb9KPyssvZyoSG6Mh0X-YKy1E2t9LqjwusMCE5_PVDY5nVyJW4bYGiOm4RndUTSi7/exec'; 
    // ========================================================== 
    // PARAMETRI URL 
    // ========================================================== 
    const params = new URLSearchParams( window.location.search ); 
    const token = params.get('token'); 
    // ========================================================== 
    // ELEMENTI PAGINA 
    // ========================================================== 
    const box = document.getElementById('box'); 
    const icon = document.getElementById('icon'); 
    const titolo = document.getElementById('titolo'); 
    const messaggio = document.getElementById('messaggio'); 
    // ========================================================== 
    // MOSTRA RISULTATO 
    // ========================================================== 
    function handleVerification(data) { 
      if (data && data.ok === true) { 
        icon.textContent = '✓'; 
        titolo.textContent = data.titolo || 'Email verificata'; 
        messaggio.textContent = data.messaggio || 'Il tuo indirizzo email è stato verificato correttamente.'; 
        return; 
      } 
      // ======================================================== 
      // ERRORE 
      // ======================================================== 
      box.classList.add('error'); 
      icon.textContent = '×'; 
      titolo.textContent = data && data.titolo ? data.titolo : 'Verifica non riuscita'; 
      messaggio.textContent = data && data.messaggio ? data.messaggio : 'Non è stato possibile verificare il tuo indirizzo email.'; 
    } 
    // ========================================================== 
    // ESPONE LA FUNZIONE GLOBALMENTE 
    // ========================================================== 
    window.handleVerification = handleVerification; 
    // ========================================================== 
    // CONTROLLO TOKEN 
    // ========================================================== 
    if (!token) { 
      handleVerification({ 
        ok: false, 
        titolo: 'Link non valido', 
        messaggio: 'Questa pagina deve essere aperta utilizzando il link ricevuto via email.' 
      }); 
    } else { 
      // ======================================================== 
      // CREA SCRIPT CROSS-DOMAIN 
      // ======================================================== 
      const script = document.createElement('script'); 
      script.src = APPS_SCRIPT_URL + '?action=verify' + '&token=' + encodeURIComponent(token) + '&callback=handleVerification'; 
      script.onerror = function() { 
        handleVerification({ 
          ok: false, 
          titolo: 'Errore', 
          messaggio: 'Si è verificato un errore durante la verifica. ' + 'Puoi chiudere questa pagina e riprovare dal link ricevuto via email.' 
        }); 
      }; 
      document.body.appendChild(script); 
    } 
  </script> 
</body> 
</html>
